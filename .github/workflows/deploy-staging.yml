name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to staging
        run: npx sst deploy --stage staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          MINDEE_API: ${{ secrets.MINDEE_API }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Run database migrations
        env:
          ADMIN_MIGRATION_TOKEN: ${{ secrets.ADMIN_MIGRATION_TOKEN }}
        run: |
          # `sst deploy` returns as soon as the new ECS task definition is
          # registered — the ALB keeps routing to the OLD container until the
          # new tasks pass health checks. Calling /api/migrations/run once,
          # right after deploy, can hit that old container: it has no pending
          # migrations bundled, reports success, and the new migration never
          # runs. Guard against that by polling until the response reports the
          # tag we expect from the migrations checked out in THIS run — an old
          # container reports no `latestTag` (or an older one) and gets
          # retried until the ALB has cut over.
          #
          # Repeated calls are safe: drizzle tracks applied migrations in
          # `drizzle.__drizzle_migrations`, so re-running against a container
          # that already applied them is a no-op.
          EXPECTED_TAG=$(jq -r '.entries[-1].tag' packages/functions/src/drizzle/migrations/meta/_journal.json)
          echo "Expecting migrations tag: $EXPECTED_TAG"

          MAX_ATTEMPTS=15
          SLEEP_SECONDS=20

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt $attempt/$MAX_ATTEMPTS: calling migrations endpoint..."
            RESPONSE=$(curl -sS --max-time 120 -X POST \
              "https://staging.api.atlaes.de/api/migrations/run" \
              -H "x-admin-token: $ADMIN_MIGRATION_TOKEN" \
              -H "content-type: application/json" || true)
            echo "$RESPONSE"

            if echo "$RESPONSE" | grep -q '"success":true' && \
               echo "$RESPONSE" | grep -q "\"latestTag\":\"$EXPECTED_TAG\""; then
              echo "Migrations applied on the deployed container (tag: $EXPECTED_TAG)."
              exit 0
            fi

            echo "Deployed container not yet on tag $EXPECTED_TAG — retrying in ${SLEEP_SECONDS}s..."
            LAST_RESPONSE="$RESPONSE"
            sleep "$SLEEP_SECONDS"
          done

          echo "Exhausted $MAX_ATTEMPTS attempts waiting for tag $EXPECTED_TAG."
          echo "Last response: $LAST_RESPONSE"
          exit 1
