          - paragraph [ref=f2e202]: The deposit activates the secure digital application process—not just an initial check.
          - paragraph [ref=f2e203]: Once your claim is activated, the CompanyPension platform provides the tools needed to complete, review, sign and submit your cash-out or refund application online.
