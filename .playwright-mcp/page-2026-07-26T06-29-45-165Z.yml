            - button "What is a company pension refund?" [expanded] [ref=f9e66] [cursor=pointer]
            - generic [ref=f9e69]:
              - paragraph [ref=f9e70]: A company pension refund means applying to get eligible employee contributions back from a contribution-based company pension scheme.
              - paragraph [ref=f9e71]: This commonly applies to VBL, ZVK, VddB and VddKO cases.
              - paragraph [ref=f9e72]: Usually, only eligible contributions paid by you as the employee are refundable. Employer-paid amounts are generally not refunded to you.
              - paragraph [ref=f9e73]: A company pension refund is separate from a German state pension refund through Deutsche Rentenversicherung.
          - button "What is the difference between a refund and a bAV cash-out?" [ref=f9e75] [cursor=pointer]
