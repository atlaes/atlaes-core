          - heading "Built for online pension applications" [level=2] [ref=f7e252]
        - generic [ref=f7e253]:
          - paragraph [ref=f7e254]: CompanyPension is a digital application platform for German company pension cash-outs and refunds.
          - paragraph [ref=f7e255]: Upload a pension document or answer guided questions. The platform extracts available details, adapts the flow to your pension type and prepares the application from the information you provide.
          - paragraph [ref=f7e256]: You review and sign the application yourself. After signing, it is technically transmitted to the relevant provider, pension scheme or institution through the CompanyPension platform.
          - paragraph [ref=f7e257]: Most standard steps run digitally and automatically. Human support is added when clarification, translation or follow-up is needed.
