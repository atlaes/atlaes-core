        - heading "A DRV refund can create the basis for a bAV lump-sum settlement" [level=2] [ref=e390]: A DRV refund can create the basis fora bAV lump-sum settlement
        - paragraph [ref=e391]: For many vested bAV entitlements, a cash-out is not available simply because you left Germany. An approved DRV refund may first be required.
      - generic [ref=e392]:
        - paragraph [ref=e393]: However, once your contributions to Deutsche Rentenversicherung have been refunded, §3(3) BetrAVG can provide the basis for requesting a lump-sum settlement of a vested bAV entitlement.
        - paragraph [ref=e394]: The DRV refund does not automatically pay out your company pension. After the DRV refund has been approved, a separate request must still be made to the employer, insurance company or pension provider responsible for the bAV.
        - paragraph [ref=e395]: CompanyPension checks whether your DRV refund status may be relevant to your bAV case and guides you through the separate online request.
