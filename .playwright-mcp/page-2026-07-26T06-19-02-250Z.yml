        - heading [level=2] [ref=e228]:
          - generic [ref=e229]: Your DRV Refund Does Not IncludeYour Company Pension
      - generic [ref=e230]:
        - paragraph [ref=e231]: Your German state pension and your company pension are two separate systems.
        - paragraph [ref=e232]: A DRV refund only covers eligible statutory pension contributions paid into Deutsche Rentenversicherung. It does not automatically include a bAV, Direktversicherung, VBL, ZVK, VddB or VddKO pension.
        - paragraph [ref=e233]: If you paid into both systems, your company pension needs a separate cash-out or refund process.
      - link "Compare company pension and DRV" [ref=e235] [cursor=pointer]:
